# NOTE: `anchor keys sync` rewrites this file through a TOML round trip and
# drops comments from the tables it touches. If a comment here disappears,
# that is why -- restore it rather than assuming the setting was removed.

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Generated by `anchor build` into target/deploy/lodz_vault-keypair.json and
# written here by `anchor keys sync`. This is the program's identity key, not a
# wallet: it holds no SOL and it is not an upgrade authority. target/ is
# gitignored.
lodz_vault = "F9XmBYVEyEwFyHAdMJs6uBvyRag3AFhQ6YMZvqm13SLW"

[registry]
url = "https://api.apr.dev"

[provider]
# Localnet only, and it stays localnet.
#
# No chain transaction is permitted from this package until the user has
# supplied all four of: a deploy keypair path, that keypair's pubkey, an
# explicit cluster approval, and a balance confirmation. Setting this to
# "Devnet" or "Mainnet" is what turned a routine `anchor test` into an
# unapproved spend in the incident recorded in
# new_project_guide/references/solana/anchor-lessons.md.
cluster = "localnet"
# Localnet-only test payer. The file is intentionally NOT created by this
# package and is gitignored; the suite in tests/ is written but not run, so
# nothing reads it yet.
#
# It deliberately does not point at ~/.config/solana/id.json. Several projects
# sharing one wallet file means they share an on-chain upgrade authority, which
# links them together permanently and publicly.
wallet = "keypair/localnet-test-payer.json"

[scripts]
# Compile the TypeScript suite first, then run plain mocha on the emitted
# JavaScript. Not ts-mocha: Node 22 strips TypeScript types natively and claims
# the .ts file before ts-node's CommonJS hook sees it, so the suite silently
# runs as an ES module and every require() in it fails. Compiling first also
# type-checks the tests against target/types/lodz_vault.ts, so a wrong
# instruction or account name fails the build instead of surfacing later as a
# confusing account-resolution error.
test = "npx tsc -p tsconfig.test.json && npx mocha -t 1000000 .test-build/tests/*.js"

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false

[test.validator]
# Agave 3.0 panics with UnspecifiedIpAddr on the `--bind-address 0.0.0.0` that
# Anchor otherwise passes. Loopback also keeps a test validator off every other
# interface on this machine.
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
